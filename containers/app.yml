templates:
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  - "templates/cloudflare.template.yml"
expose:
  - "80:80"
  - "443:443"
params:
  db_default_text_search_config: "pg_catalog.english"
  db_shared_buffers: "4096MB"
  # 빌드 워크플로(.github/workflows/build.yml)가 --set params.version=v<X.Y.Z> 로 덮어쓴다.
  # 빌드 시 여기 값은 Discourse 소스의 git ref 로 사용된다.
  version: stable

# docker_args: "--net=host"
# docker_args: "--network=discourse_build_network"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8

  # Launcher V2 의 defaultBakeEnv 에 포함되어 이미지 ENV 로 구워진다.
  # 빌드 단계에서는 DB/Redis 를 건드리지 않고, 파드가 뜰 때
  # db:migrate -> assets:precompile(SKIP_EMBER_CLI_COMPILE=1) -> unicorn 순으로 수행한다.
  MIGRATE_ON_BOOT: "1"
  PRECOMPILE_ON_BOOT: "1"

  # 아래 DISCOURSE_* 항목은 운영 클러스터가 주입하는 "런타임 계약"을 문서화한 것이다.
  # 모두 Launcher 의 KnownSecrets 라서 이미지 ENV/ARG 로는 절대 구워지지 않는다.
  DISCOURSE_HOSTNAME: "forum.tinyrack.net"
  DISCOURSE_DB_HOST: ""
  DISCOURSE_DB_PORT: ""
  DISCOURSE_DB_NAME: ""
  DISCOURSE_DB_USERNAME: ""
  DISCOURSE_DB_PASSWORD: ""

  DISCOURSE_REDIS_HOST: ""
  DISCOURSE_REDIS_PORT: ""
  DISCOURSE_REDIS_USERNAME: ""
  DISCOURSE_REDIS_PASSWORD: ""

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/discourse-doc-categories.git
          - git clone https://github.com/discourse/discourse-bbcode
          - git clone https://github.com/discourse/discourse-translator
          - git clone https://github.com/discourse/discourse-prometheus
