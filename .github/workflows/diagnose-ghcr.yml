name: Diagnose GHCR Token
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Show the identity + token that Actions gives us
        run: |
          echo "actor=$GITHUB_ACTOR  trigger=${GITHUB_TRIGGERING_ACTOR:-n/a}  repo=$GITHUB_REPOSITORY"
          echo "run_id=$GITHUB_RUN_ID ref=$GITHUB_REF"
          echo "token prefix: $(printf '%s' '${{ secrets.GITHUB_TOKEN }}' | cut -c1-8)"
      - name: Probe GHCR access for the token (no secret printing)
        run: |
          set -uo pipefail
          TOK=$(curl -s -u "${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:tinyrack-net/discourse:pull,push" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          [ -n "$TOK" ] || { echo "::error::no registry token"; exit 1; }
          echo "--- GET /v2/ with token ---"
          curl -s -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $TOK" https://ghcr.io/v2/
          echo "--- granted access claim ---"
          printf '%s' "$TOK" | python3 - <<'PY'
import sys, base64, json
t = sys.stdin.read().strip()
# token may be "ghs_<id>_<base64url>@<base64url>" style; find the JWT-ish part
cands = [t]
if t.startswith("ghs_"):
    core = t[4:]
    cands.append(core.split("_", 1)[-1])
for c in cands:
    for part in c.split(".")[1:2]:
        p = part + "=" * (-len(part) % 4)
        try:
            print(json.dumps(json.loads(base64.urlsafe_b64decode(p))))
        except Exception as e:
            pass
PY
      - name: Real write test against the package
        run: |
          set -uo pipefail
          mkdir -p /tmp/ctx && echo hi > /tmp/ctx/hi.txt
          printf 'FROM busybox\nCOPY hi.txt /hi.txt\n' > /tmp/ctx/Dockerfile
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -q -t ghcr.io/tinyrack-net/discourse:diag-test /tmp/ctx
          echo "--- push result ---"
          docker push ghcr.io/tinyrack-net/discourse:diag-test && echo "PUSH_OK" || echo "PUSH_DENIED"
