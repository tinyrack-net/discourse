name: Diagnose GHCR Token
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Show the identity Actions gives us
        run: |
          echo "actor=$GITHUB_ACTOR trigger=${GITHUB_TRIGGERING_ACTOR:-n/a} repo=$GITHUB_REPOSITORY"
          echo "run_id=$GITHUB_RUN_ID ref=$GITHUB_REF"
      - name: Probe GHCR access for the token (no secret printing)
        run: |
          set -uo pipefail
          TOK=$(curl -s -u "${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/token?service=ghcr.io&scope=repository:tinyrack-net/discourse:pull,push" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          [ -n "$TOK" ] || { echo "no registry token"; exit 1; }
          echo "GET /v2/ status: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" https://ghcr.io/v2/)"
          echo "granted access claim:"
          python3 -c "import sys,base64,json;t=sys.argv[1];c=t[4:].split('_',1)[-1] if t.startswith('ghs_') else t;p=c.split('.')[1];p=p+'='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))" "$TOK"
      - name: Real write test against the package
        run: |
          set -uo pipefail
          mkdir -p /tmp/ctx && echo hi > /tmp/ctx/hi.txt
          printf 'FROM busybox\nCOPY hi.txt /hi.txt\n' > /tmp/ctx/Dockerfile
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -q -t ghcr.io/tinyrack-net/discourse:diag-test /tmp/ctx
          echo "--- push result ---"
          docker push ghcr.io/tinyrack-net/discourse:diag-test && echo "PUSH_OK" || echo "PUSH_DENIED"
